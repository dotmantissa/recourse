name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m venv .venv && .venv/bin/pip install -r requirements.txt
      - run: npm ci && npm --prefix web ci
      - run: npm run setup:contracts
      - run: npm --prefix web exec -- playwright install --with-deps chromium
      - run: npm run verify:acceptance
      - run: npm audit --audit-level=moderate && npm --prefix web audit --audit-level=moderate
