services:
  - type: web
    name: recourse-evidence
    runtime: node
    plan: free
    region: oregon
    branch: main
    rootDir: .
    buildCommand: npm ci --omit=dev
    startCommand: node api/server.mjs
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: EVIDENCE_DIR
        value: evidence
      - key: RESULT_DIR
        value: results
      - key: RESULT_ENCRYPTION_KEY
        sync: false
      - key: FRONTEND_ORIGIN
        value: https://recourse-gamma.vercel.app
      - key: RECOURSE_CONTRACT_ADDRESS
        value: 0x51eDCf8f3Bdbb69a6e83b1cA5076a77C2E5Cdc35
      - key: REQUEST_PRICE_WEI
        value: "2000000000000000000"
      - key: MONITOR_SECRET
        sync: false
      - key: AGENT_SIGNING_KEY
        sync: false
      - key: PRIVY_APP_ID
        sync: false
      - key: PRIVY_APP_SECRET
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_REPOSITORY
        value: dotmantissa/recourse
      - key: GITHUB_EVIDENCE_BRANCH
        value: evidence
